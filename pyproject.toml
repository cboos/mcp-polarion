[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-polarion"
version = "0.2.2"
description = "MCP server for Polarion ALM — full CRUD via pylero (SOAP/WSDL SDK)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "pylero>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcp-polarion = "mcp_polarion.server:main"
